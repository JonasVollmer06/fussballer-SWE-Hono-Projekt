info:
  name: Nationalitaet Falsch
  type: http
  seq: 8

http:
  method: GET
  url: https://localhost:3000/rest?nationalitaet=xyz
  headers:
    - name: Accept
      value: application/json
  params:
    - name: nationalitaet
      value: xyz
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
