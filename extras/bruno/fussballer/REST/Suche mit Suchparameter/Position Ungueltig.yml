info:
  name: Position Ungueltig
  type: http
  seq: 10

http:
  method: GET
  url: https://localhost:3000/rest?position=xyz
  headers:
    - name: Cache-Control
      value: no-cache
    - name: Postman-Token
      value: <calculated when request is sent>
    - name: Host
      value: <calculated when request is sent>
    - name: User-Agent
      value: PostmanRuntime/7.31.1
    - name: Accept-Encoding
      value: gzip, deflate, br
    - name: Connection
      value: keep-alive
    - name: Accept
      value: application/json
  params:
    - name: position
      value: xyz
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
