info:
  name: Fussballer 50 mit falscher Versionsnummer ändern
  type: http
  seq: 2

http:
  method: PUT
  url: "{{restUrl}}/:id"
  headers:
    - name: If-Match
      value: "0"
  params:
    - name: id
      value: "50"
      type: path
  body:
    type: json
    data: |-
      {
        "nachname": "Knecht",
        "nationalitaet": "Deutschland",
        "position": "MITTELFELDSPIELER",
        "geburtsdatum": "2004-05-14"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "412"
    - expression: res.headers['content-type']
      operator: eq
      value: application/problem+json
    - expression: res.body.statusCode
      operator: eq
      value: "412"
    - expression: res.body.detail
      operator: contains
      value: Die Versionnummer 0 ist ungueltig

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
